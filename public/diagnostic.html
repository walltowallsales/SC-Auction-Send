<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SellerChamp Marketplace Diagnostic</title><link rel="stylesheet" href="styles.css"><style>pre{white-space:pre-wrap;word-break:break-word;background:#f4f5f7;padding:12px;border-radius:10px;font-size:12px}.diag{margin:16px}.good{background:#e9f8ef;padding:12px;border-radius:10px}.warn{background:#fff5d6;padding:12px;border-radius:10px}</style></head><body><header><div><h1>Marketplace Diagnostic</h1><p>Read-only test for SKU <b>2404-40708</b></p></div></header><main class="diag"><div class="warn"><b>No product changes will be made.</b> This page only reads SellerChamp data.</div><div id="out" class="card"><h2>Loading diagnostic…</h2><div class="stopwatch">⏱ <span id="clock">00:00</span></div></div></main><script>
let start=Date.now();const c=document.getElementById('clock');const fmt=()=>{const s=Math.floor((Date.now()-start)/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};const timer=setInterval(()=>{if(c)c.textContent=fmt()},250);
(async()=>{try{const r=await fetch('/diagnostic-marketplace-2404-40708');const j=await r.json();if(r.status===401){document.getElementById('out').innerHTML='<h2>PIN required</h2><p>Open the normal Auction Inventory page, enter your PIN, then return to <b>/diagnostic.html</b>.</p>';return}if(!r.ok)throw Error(j.error||'Diagnostic failed');clearInterval(timer);document.getElementById('out').innerHTML=`<h2>SKU ${j.sku}</h2><p class="good"><b>${j.diagnostic}</b><br>SellerChamp parsed status: <b>${String(j.parsed_status).toUpperCase()}</b><br>Loaded in ${fmt()}</p><h3>Marketplace fields from product list</h3><pre>${esc(JSON.stringify(j.marketplace_fields_from_list,null,2))}</pre><h3>Marketplace fields from full product</h3><pre>${esc(JSON.stringify(j.marketplace_fields_from_full,null,2))}</pre><details><summary>Full product response</summary><pre>${esc(JSON.stringify(j.full_product,null,2))}</pre></details>`}catch(e){clearInterval(timer);document.getElementById('out').innerHTML='<h2>Diagnostic error</h2><pre>'+esc(e.message)+'</pre>'}})();function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
</script></body></html>
